# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.18.0/www/static/schema.json
version: 2

project_name: coupangctl

builds:
  - id: coupangctl
    main: ./cmd/coupangctl
    binary: coupangctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: coupangctl
    ids:
      - coupangctl
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - BROWSER_BRIDGE.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

# Dry-run metadata only until the macOS archives are Developer ID signed and
# notarized. The source-build formula remains the documented beta path.
homebrew_casks:
  - name: coupangctl
    ids:
      - coupangctl
    binaries:
      - coupangctl
    directory: Casks
    homepage: https://github.com/JungHoonGhae/coupang-ctl
    description: Sync and analyze personal Coupang orders locally
    skip_upload: true
    repository:
      owner: JungHoonGhae
      name: homebrew-tap

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^Merge '

release:
  draft: true
  prerelease: auto
  header: |
    {{- if .Prerelease }}
    > [!WARNING]
    > This is an unsigned prerelease. The macOS binaries are not Developer ID signed or notarized, and the Windows binaries are not Authenticode signed. SHA-256 checksums and GitHub attestations do not replace native publisher trust.
    {{- end }}
  preflight:
    fail_on_error: true
