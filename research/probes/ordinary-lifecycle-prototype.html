<!doctype html><html lang="ko"><meta charset="utf-8"><title>전용 쇼핑 연결 — 상태 검증 시제품</title>
<style>body{font:16px/1.65 system-ui;max-width:900px;margin:40px auto;padding:0 24px;color:#172332;background:#fafbfc}h1{font-size:27px}section{background:white;border:1px solid #d6dce3;border-radius:10px;padding:20px;margin:20px 0}button{font:inherit;background:#edf3ff;border:1px solid #bdcce5;border-radius:5px;padding:7px 12px;margin:5px;cursor:pointer}dt{font-weight:600}dd{margin:0 0 10px}strong{color:#153b84}.note{color:#586779}#tabs [aria-selected=true]{background:#234e92;color:white}</style>
<h1>전용 쇼핑 연결: “실행 중”이면 검색해도 될까요?</h1>
<p>폐기 가능한 상태 모델 시제품입니다. 브라우저·로그인·프로필·네트워크를 실제로 조작하지 않습니다. 창 없는 프로세스, 최소화된 창, 실행 권한과 사이트 인증을 구분했을 때 자동 준비의 빈틈이 어디에 남는지 확인합니다.</p>
<p class="note">실험 근거와 미검증 경계: <a href="https://github.com/JungHoonGhae/coupang-ctl/issues/22">전용 Chrome의 새 실행·재시작 검증</a>. 아래 버튼은 실제 관측을 대체하지 않습니다.</p>
<section><h2>현재 상태</h2><dl id="state"></dl><strong id="message"></strong></section>
<section><h2>자유롭게 바꿔 보기</h2><div id="actions"></div></section>
<section><h2>상황별 따라 하기</h2><div id="tabs" role="tablist"></div><p id="description"></p><div id="steps"></div></section>
<script>
// Portable pure model: no DOM, persistence or browser commands.
const initial = () => ({registered:false,process:false,window:'없음',permission:false,authentication:'미확인',quietStart:'미검증',reads:0,message:'최초 준비가 필요합니다.'});
function transition(previous,action) {
 const s={...previous};
 switch(action) {
 case 'register': s.registered=true;s.message='전용 연결을 선택했습니다. 일상용 Chrome은 대상이 아닙니다.';break;
 case 'prepare': if(!s.registered){s.message='먼저 전용 연결을 선택하세요.';break;}s.process=true;s.window='최소화';s.message='최초 준비 단계에서만 창을 한 번 최소화한 상황입니다.';break;
 case 'allow':s.permission=true;s.message='사용자가 실제로 허용한 경우를 모의했습니다. 권한 자동 허용이 아닙니다.';break;
 case 'login':s.authentication='유효';s.message='사용자가 로그인한 경우입니다. 검색 성공과 계정 인증은 별개입니다.';break;
 case 'read':if(!s.registered||!s.process||s.window!=='최소화'||!s.permission){s.message='읽기를 보류합니다. 다른 Chrome으로 대체하거나 창을 강제 복원·최소화하지 않습니다.';break;}s.reads++;s.message='공개 검색을 모의했습니다. 계정 자료는 별도 인증·coverage 확인이 필요합니다.';break;
 case 'restore':s.window='사용자가 복원';s.message='사용자와 경쟁하지 않고 현재 읽기를 보류합니다.';break;
 case 'closeWindow':s.window='없음';s.message='프로세스는 살아 있어도 읽을 탭이 없습니다.';break;
 case 'quit':case 'crash':s.process=false;s.window='없음';s.authentication='미확인';s.message='저장된 권한은 재검증해야 합니다. PID·창 ID는 재사용하지 않습니다.';break;
 case 'hiddenLaunch':s.process=true;s.window='노출 관측';s.quietStart='실측 실패';s.message='숨김/비활성 실행 설정만으로 창 노출을 막지 못한 실제 실험을 나타냅니다. 포커스 보존과 창 무노출은 다릅니다.';break;
 case 'noWindowLaunch':s.process=true;s.window='없음';s.message='창 없는 실행 실측을 나타냅니다. 화면 노출은 관측되지 않았지만 읽을 탭도 확인되지 않았습니다. 읽기 준비 성공이 아닙니다.';break;
 case 'restoreSaved':s.process=true;s.window='노출 관측';s.quietStart='실측 실패';s.message='빈 실험 프로필을 최소화·정상 종료한 뒤 세션 복원했을 때 창 노출과 앱 활성화를 관측했습니다. 기존 계정 프로필 검증은 아닙니다.';break;
 case 'createQuietOnce':s.process=true;s.window='최소화';s.quietStart='한 번 무노출 관측';s.message='창 생성 시 최소화·숨김을 함께 전달한 한 번의 관측입니다. 탭이 생겨도 반복 무노출·실제 상품 읽기는 아직 입증되지 않았습니다.';break;
 case 'createRepeatFailed':s.process=true;s.window='노출 관측';s.quietStart='반복 실측 실패';s.message='같은 속성 조합의 반복 실행 중 창 노출과 앱 활성화가 관측됐습니다. 다른 실행이 조용했어도 자동 시작 보장은 통과하지 못합니다.';break;
 case 'wake':s.authentication='미확인';s.message='절전 복귀 후 대상·최소화·권한·인증을 다시 확인해야 합니다. 실제 복귀 성공을 뜻하지 않습니다.';break;
 case 'renewal':s.authentication='갱신 필요';s.message='계정 읽기는 실제 사용자 로그인 갱신을 기다립니다. 임의로 창을 열지 않습니다.';break;
 }
 return s;
}
</script><script>
const labels={register:'전용 연결 선택',prepare:'최초 준비·최소화',allow:'사용자 권한 허용',login:'사용자 로그인',read:'공개 검색 요청',restore:'사용자가 창 복원',closeWindow:'전용 창 닫힘',quit:'정상 종료',crash:'프로세스 비정상 종료',hiddenLaunch:'숨김 실행 실측 재현',restoreSaved:'저장된 세션 재시작 실측',noWindowLaunch:'창 없는 실행 실측 재현',wake:'절전 복귀',renewal:'사이트 인증 만료'};
labels.createQuietOnce='최소화·숨김 창 생성: 한 번의 관측';
labels.createRepeatFailed='같은 창 생성: 반복 중 실패';
const scenarios=[
 ['정상 재사용','최초 준비 이후 두 읽기에 다시 연결하거나 창 상태를 바꾸지 않습니다.',['register','prepare','allow','read','read']],
 ['새 실행의 함정','숨김 실행 설정과 실제 창 무노출은 같지 않습니다.',['register','hiddenLaunch','allow','read']],
 ['최소화 저장 후 재시작','최소화 상태에서 정상 종료했어도 재시작 창 노출·포커스를 막지 못했습니다.',['register','prepare','quit','restoreSaved','read']],
 ['창 없는 프로세스','프로세스가 살아 있어도 Apple Events가 읽을 탭이 없습니다.',['register','noWindowLaunch','allow','read']],
 ['한 번의 성공과 보장','동일한 창 생성 속성도 반복하면 노출됩니다. 호출 성공·마지막 최소화 상태와 과정 전체의 조용함은 다릅니다.',['register','noWindowLaunch','createQuietOnce','quit','noWindowLaunch','createRepeatFailed','read']],
 ['사용자와 경쟁','사용자가 복원한 창을 요청마다 다시 최소화하지 않습니다.',['register','prepare','allow','restore','read']],
 ['재시작·인증 분리','최초 허용, 실행 준비, 계정 인증은 각각 재확인합니다.',['register','prepare','allow','login','quit','noWindowLaunch','read']],
 ['절전·만료','공개 검색 가능성과 개인 계정 읽기 가능성은 별개입니다.',['register','prepare','allow','login','wake','renewal','read']]
];
let state=initial(), selected=0, step=0;
function button(label,action){const b=document.createElement('button');b.textContent=label;b.onclick=action;return b;}
function act(action){state=transition(state,action);render();}
function render(){const panel=document.querySelector('#state');panel.replaceChildren();const fields={'전용 연결 선택':state.registered?'예':'아니요','프로세스':state.process?'실행 중':'없음','전용 창':state.window,'Chrome 실행 권한':state.permission?'허용 상황 모의':'미허용','사이트 인증':state.authentication,'새 실행의 무노출':state.quietStart,'모의 검색 완료':state.reads};for(const [k,v] of Object.entries(fields)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;panel.append(dt,dd);}document.querySelector('#message').textContent=state.message;}
for(const [a,label] of Object.entries(labels))document.querySelector('#actions').append(button(label,()=>act(a)));
document.querySelector('#actions').append(button('전체 초기화',()=>{state=initial();render();}));
function walkthrough(index){selected=index;step=0;state=initial();render();document.querySelector('#description').textContent=scenarios[index][1];const tabs=document.querySelector('#tabs');tabs.replaceChildren();scenarios.forEach((s,i)=>{const b=button(s[0],()=>walkthrough(i));b.setAttribute('role','tab');b.setAttribute('aria-selected',i===selected);tabs.append(b);});const steps=document.querySelector('#steps');steps.replaceChildren();scenarios[index][2].forEach((a,i)=>{const b=button((i+1)+'. '+labels[a],()=>{if(i!==step)return;act(a);step++;for(const [j,node] of [...steps.children].entries())node.disabled=j!==step;});b.disabled=i!==0;steps.append(b);});}
walkthrough(0);
</script></html>
