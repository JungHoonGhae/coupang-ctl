<!doctype html><html lang="ko"><meta charset="utf-8"><title>창 준비 판단 실험</title>
<style>body{font:17px system-ui;max-width:850px;margin:40px auto;padding:20px;color:#202530;background:#f7f8fa}button{font:inherit;padding:10px;margin:5px;border:1px solid #bbb;border-radius:6px;background:white}button[aria-selected=true]{background:#def}section{margin:20px 0;padding:20px;background:white;border:1px solid #ddd}dt{font-weight:bold;margin-top:12px}dd{margin:4px 0}#notice{color:#713800}</style>
<h1>창 준비 판단 실험 — 폐기용 모델</h1>
<p>최초 등록된 전용 프로필에서만 창 준비를 요청합니다. API가 최소화를 보고한 것과 실제 화면에 나타나지 않은 것은 다릅니다. 이 모델은 Chrome 실측 결과가 아닙니다.</p>
<section><h2>현재 상태</h2><dl id="state"></dl><p id="notice"></p></section>
<section><h2>자유롭게 눌러 보기</h2><div id="actions"></div></section>
<section><h2>상황별 따라 하기</h2><div id="tabs" role="tablist"></div><p id="description"></p><div id="steps"></div></section>
<script>
// Portable pure model. No browser API, persistence, DOM or fabricated live evidence.
const initial=()=>({registered:false,phase:'미등록',requested:false,apiMinimized:false,observedQuiet:null,note:'최초 실험 등록부터 시작하세요.'});
function reduce(s,a){
 if(a==='reset')return initial();
 if(a==='register')return {...s,registered:true,phase:'다음 시작 대기',note:'등록은 시작 실측 성공이 아닙니다.'};
 if(a==='startup')return !s.registered?{...s,note:'미등록: 창을 만들지 않습니다.'}:{...s,phase:'창 개수 확인',requested:false,apiMinimized:false,observedQuiet:null,note:'새 프로필 시작 이벤트를 받았습니다.'};
 if(a==='existing')return s.phase==='창 개수 확인'?{...s,phase:'기존 창 보존',note:'기존 창은 복원하거나 다시 최소화하지 않습니다.'}:{...s,note:'창 확인 단계가 아닙니다.'};
 if(a==='absent')return s.phase==='창 개수 확인'?{...s,phase:'생성 응답 대기',requested:true,note:'최소화·비활성 창 하나만 요청합니다.'}:{...s,note:'생성 중복 요청을 하지 않습니다.'};
 if(a==='callback')return s.phase==='생성 응답 대기'?{...s,phase:'OS 관측 대기',apiMinimized:true,note:'API 완료만으로 무노출을 확정하지 않습니다.'}:{...s,note:'현재 요청과 일치하지 않는 응답은 사용하지 않습니다.'};
 if(a==='uncertain')return s.requested?{...s,phase:'결과 불확실',note:'새 창을 다시 만들지 않고 실제 상태를 재관측해야 합니다.'}:{...s,note:'실행 중인 생성 요청이 없습니다.'};
 if(a==='quiet')return s.phase==='OS 관측 대기'?{...s,phase:'이번 관측 통과',observedQuiet:true,note:'이번 구간만의 근거입니다. 충돌·절전·실제 검색 검증은 별도입니다.'}:{...s,note:'창 생성/응답과 연결되지 않은 조용함은 성공 증거가 아닙니다.'};
 if(a==='exposed')return {...s,phase:'무노출 반례',observedQuiet:false,note:'잠깐 나타났다가 최소화되어도 무노출 실패입니다.'};
 if(a==='windowLost')return {...s,phase:'복구 미검증',note:'창 닫힘은 프로필 시작 이벤트가 아닙니다. 자동 복구를 가정하지 않습니다.'};
 return s;
}
const labels={reset:'처음부터',register:'최초 등록',startup:'Chrome 새 시작',existing:'기존 창 발견',absent:'창 없음 확인',callback:'최소화 API 응답',uncertain:'응답 결과 불확실',quiet:'OS 무노출 관측',exposed:'창 노출 관측',windowLost:'창만 닫힘'};
const scenarios=[
 ['준비 성공 구간','API 응답 뒤 별도의 OS 관측이 필요합니다.',['register','startup','absent','callback','quiet']],
 ['순간 노출 반례','API가 최소화를 보고해도 화면에 나타나면 실패입니다.',['register','startup','absent','callback','exposed']],
 ['결과 불확실','응답을 잃었다고 중복 창을 만들어서는 안 됩니다.',['register','startup','absent','uncertain','absent']],
 ['기존 창과 창 소실','기존 창 보존과 사라진 창의 복구는 다른 문제입니다.',['register','startup','existing','windowLost']]
];
let state=initial(),selected=0;
const button=(key)=>{const b=document.createElement('button');b.textContent=labels[key];b.onclick=()=>{state=reduce(state,key);render()};return b};
function render(){const dl=document.getElementById('state');dl.replaceChildren();for(const [k,v]of Object.entries({'등록됨':state.registered,'단계':state.phase,'생성 요청함':state.requested,'API 최소화 보고':state.apiMinimized,'실제 무노출 관측':state.observedQuiet===null?'미확인':state.observedQuiet})){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=String(v);dl.append(dt,dd)}document.getElementById('notice').textContent=state.note;document.getElementById('description').textContent=scenarios[selected][1];document.getElementById('steps').replaceChildren(...scenarios[selected][2].map(button));document.querySelectorAll('[role=tab]').forEach((b,i)=>b.setAttribute('aria-selected',i===selected));}
document.getElementById('actions').append(...Object.keys(labels).map(button));
scenarios.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.onclick=()=>{selected=i;state=initial();render()};document.getElementById('tabs').append(b)});render();
</script></html>
