version: 2

# Keep routine version updates quiet: one grouped minor/patch PR per ecosystem,
# once a month, after a short release cooldown. Dependabot security updates are
# intentionally unaffected by the version-update allow lists and PR limits.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:20"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      probe-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      workflow-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
