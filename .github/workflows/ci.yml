name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, vet, and probe typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install probe dependencies
        run: npm ci

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Launch installed Chrome twice with one clean headless profile
        run: COUPANGCTL_LIVE_BROWSER_LAUNCH=1 go test ./internal/browser -run '^TestLiveInstalledChromeHeadlessLaunch$' -count=1

      - name: Type-check research probes
        run: npm run typecheck

      - name: Test ordinary-browser extension
        run: npm run test:extension

      - name: Build and verify optional Chrome Web Store package
        run: |
          go run ./cmd/extensionpack --output "$RUNNER_TEMP/coupangctl-extension.zip"
          go run ./cmd/extensionpack --verify "$RUNNER_TEMP/coupangctl-extension.zip"

  release-contract:
    name: Six-target release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean

      - name: Verify release contents and checksums
        run: go run ./cmd/releasecheck --require-sbom ./dist

  windows-browser-bridge:
    name: Windows browser contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test isolated HKCU registration, native-host ping, profile safety, and quiet defaults
        shell: pwsh
        run: |
          go test ./internal/releasecontract -run '^TestPowerShellInstaller' -count=1
          go test ./internal/browserbridge -run '^TestWindows' -count=1
          go test ./internal/browser -run '^(TestOrdinaryBrowserNativeHostPing|TestDedicatedProfileLock|TestProfileIdentity|TestCurrentBrowser|TestDefaultFetchNeverOpensAVisibleBrowserFallback)' -count=1
          $env:COUPANGCTL_LIVE_BROWSER_LAUNCH = '1'
          go test ./internal/browser -run '^TestLiveInstalledChromeHeadlessLaunch$' -count=1

      - name: Generate Windows package-manager metadata
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'coupangctl-package-manifests'
          go run ./cmd/packagemanifests `
            --tag v1.2.3 `
            --source-sha256 ('a' * 64) `
            --windows-amd64-sha256 ('b' * 64) `
            --windows-arm64-sha256 ('c' * 64) `
            --output $output
          $installer = Get-Content -Raw -LiteralPath (Join-Path $output 'winget/manifests/j/JungHoonGhae/coupangctl/1.2.3/JungHoonGhae.coupangctl.installer.yaml')
          if ($installer -notmatch 'NestedInstallerType: portable' -or $installer -notmatch 'PortableCommandAlias: coupangctl') {
            throw 'generated WinGet portable manifest is incomplete'
          }

  macos-browser-profile:
    name: macOS browser profile contracts
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test native profile safety and quiet defaults
        run: |
          go test ./internal/releasecontract -run '^TestPOSIXInstaller' -count=1
          go test ./internal/browser -run '^(TestDedicatedProfileLock|TestProfileIdentity|TestCurrentBrowser|TestDefaultFetchNeverOpensAVisibleBrowserFallback)' -count=1
          COUPANGCTL_LIVE_BROWSER_LAUNCH=1 go test ./internal/browser -run '^TestLiveInstalledChromeHeadlessLaunch$' -count=1

      - name: Parse generated Homebrew and WinGet metadata
        run: |
          output="$RUNNER_TEMP/coupangctl-package-manifests"
          go run ./cmd/packagemanifests \
            --tag v1.2.3 \
            --source-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --windows-amd64-sha256 bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --windows-arm64-sha256 cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --output "$output"
          ruby -c "$output/homebrew/Formula/coupangctl.rb"
          ruby -e 'require "yaml"; Dir[ARGV.fetch(0)].each { |file| document = YAML.safe_load(File.read(file), permitted_classes: [], permitted_symbols: [], aliases: false); abort(file) unless document["PackageIdentifier"] == "JungHoonGhae.coupangctl" && document["ManifestVersion"] == "1.12.0" }' "$output/winget/manifests/j/JungHoonGhae/coupangctl/1.2.3/*.yaml"
