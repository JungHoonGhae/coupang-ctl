name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication-policy:
    name: Native-signing publication policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Enforce native-signing publication policy
        run: go run ./cmd/releasepolicy --tag "${GITHUB_REF_NAME}"

  browser-profile-contracts:
    name: Browser profile contracts (${{ matrix.os }})
    needs: publication-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Windows direct installer
        if: runner.os == 'Windows'
        run: go test ./internal/releasecontract -run '^TestPowerShellInstaller' -count=1

      - name: Test POSIX direct installer
        if: runner.os != 'Windows'
        run: go test ./internal/releasecontract -run '^TestPOSIXInstaller' -count=1

      - name: Parse generated Homebrew and WinGet metadata
        if: runner.os == 'macOS'
        run: |
          output="$RUNNER_TEMP/coupangctl-package-manifests"
          go run ./cmd/packagemanifests \
            --tag v1.2.3 \
            --source-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --windows-amd64-sha256 bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --windows-arm64-sha256 cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --output "$output"
          ruby -c "$output/homebrew/Formula/coupangctl.rb"
          ruby -e 'require "yaml"; Dir[ARGV.fetch(0)].each { |file| document = YAML.safe_load(File.read(file), permitted_classes: [], permitted_symbols: [], aliases: false); abort(file) unless document["PackageIdentifier"] == "JungHoonGhae.coupangctl" && document["ManifestVersion"] == "1.12.0" }' "$output/winget/manifests/j/JungHoonGhae/coupangctl/1.2.3/*.yaml"

      - name: Test native profile safety and quiet defaults
        env:
          COUPANGCTL_LIVE_BROWSER_LAUNCH: "1"
        run: |
          go test ./internal/browser -run '^(TestDedicatedProfileLock|TestProfileIdentity|TestCurrentBrowser|TestDefaultFetchNeverOpensAVisibleBrowserFallback)' -count=1
          go test ./internal/browser -run '^TestLiveInstalledChromeHeadlessLaunch$' -count=1

  release:
    name: Build, verify, and publish release
    needs: browser-profile-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install probe dependencies
        run: npm ci

      - name: Run release tests
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false
          go mod verify
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          npm audit --audit-level=high
          npm run typecheck
          npm run test:extension
          sh -n ./installers/install.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate future signed Homebrew cask metadata
        run: |
          ruby -c dist/homebrew/Casks/coupangctl.rb
          rg -q '^  binary "coupangctl"$' dist/homebrew/Casks/coupangctl.rb
          if rg -n 'xattr|^[[:space:]]*zap[[:space:]]+do|^[[:space:]]*(trash|delete)[[:space:]]' dist/homebrew/Casks/coupangctl.rb; then
            echo "generated cask contains a forbidden trust-bypass or destructive stanza" >&2
            exit 1
          fi

      - name: Verify release contents and checksums
        run: go run ./cmd/releasecheck --require-sbom ./dist

      - name: Attest the checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/checksums.txt

      - name: Attest every checksummed artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
